<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0c0d12]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Telemetry Console</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#13151c',
              elevated: '#1a1d26',
              border: '#262936',
              muted: '#7d859a'
            }
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Leaflet Map Assets -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Firebase Compat SDKs (Auth + RTDB) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    .leaflet-container {
      background: #111319 !important;
      font-family: inherit;
    }
    .leaflet-bar {
      border: 1px solid #262936 !important;
      box-shadow: none !important;
      border-radius: 6px !important;
      overflow: hidden;
    }
    .leaflet-bar a {
      background-color: #1a1d26 !important;
      color: #9aa2b6 !important;
      border-bottom: 1px solid #262936 !important;
    }
    .leaflet-bar a:hover {
      background-color: #262a37 !important;
      color: #fff !important;
    }
    .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(2.2) hue-rotate(200deg) saturate(0.25) brightness(0.75);
    }
  </style>
</head>
<body class="h-full text-slate-200 antialiased font-sans flex flex-col selection:bg-slate-700 selection:text-white">

  <!-- ==================== VIEW 1: AUTHENTICATION SCREEN ==================== -->
  <div id="view-auth" class="min-h-screen w-full flex items-center justify-center p-6 bg-[#0c0d12]">
    <div class="w-full max-w-sm">
      <div class="mb-8">
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-surface border border-surface-border text-xs text-surface-muted mb-4">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Restricted Environment
        </div>
        <h1 class="text-xl font-semibold text-slate-100 tracking-tight">Telemetry Console</h1>
        <p class="text-xs text-surface-muted mt-1">Authenticate with your administrative Firebase credentials.</p>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5" for="input-email">Account Email</label>
          <input 
            type="email" 
            id="input-email" 
            required 
            autocomplete="email"
            class="w-full px-3 py-2 bg-surface border border-surface-border rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-slate-400 transition" 
            placeholder="admin@domain.com"
          >
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5" for="input-password">Master Password</label>
          <input 
            type="password" 
            id="input-password" 
            required 
            autocomplete="current-password"
            class="w-full px-3 py-2 bg-surface border border-surface-border rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-slate-400 transition" 
            placeholder="••••••••••••"
          >
        </div>

        <div id="auth-error-banner" class="hidden p-2.5 rounded-lg bg-red-950/40 border border-red-900/60 text-red-400 text-xs"></div>

        <button 
          type="submit" 
          id="btn-login-submit"
          class="w-full mt-2 py-2.5 px-4 bg-slate-100 hover:bg-white text-slate-900 font-medium text-xs rounded-lg transition duration-150 flex items-center justify-center gap-2"
        >
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== VIEW 2: OPERATIONAL DASHBOARD ==================== -->
  <div id="view-dashboard" class="hidden flex-1 flex flex-col min-h-screen">
    
    <header class="border-b border-surface-border bg-surface px-6 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span class="text-sm font-semibold tracking-tight text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          vivo v15 Control Node
        </span>
        <span class="text-xs px-2 py-0.5 rounded bg-[#1a1d26] text-surface-muted border border-surface-border font-mono">
          child-19156
        </span>
      </div>

      <div class="flex items-center gap-4 text-xs">
        <span id="session-user-badge" class="text-surface-muted hidden sm:inline"></span>
        <button 
          id="btn-logout" 
          class="px-2.5 py-1.5 rounded-md border border-surface-border text-slate-400 hover:text-white hover:bg-surface-elevated transition"
        >
          Disconnect
        </button>
      </div>
    </header>

    <div class="border-b border-surface-border px-6 flex gap-6 bg-[#101217]">
      <button 
        id="tab-btn-live" 
        onclick="setActiveTab('live')" 
        class="py-3 text-xs font-medium border-b-2 border-white text-white transition flex items-center gap-2"
      >
        Live Telemetry & Geolocation
      </button>
      <button 
        id="tab-btn-drive" 
        onclick
